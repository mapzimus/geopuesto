# Optional hourly / dispatch backup. Copy this file to
# mapzimus/maxwellhowegis/.github/workflows/sync-geopuesto.yml
# so the parent can catch a missed pin the same way it syncs lidar-test.
#
# Instant updates already come from this repo's sync-portfolio.yml
# (needs PORTFOLIO_SYNC_TOKEN). This file is the safety net.

name: Sync geopuesto submodule

on:
  repository_dispatch:
    types: [geopuesto-push]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-geopuesto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump submodule to latest geopuesto main
        id: bump
        run: |
          git submodule update --init --remote --depth 1 geopuesto
          if git diff --quiet -- geopuesto; then
            echo "Already up to date."
          else
            sha=$(git -C geopuesto rev-parse --short HEAD)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add geopuesto
            git commit -m "Sync geopuesto to $sha"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        # Commits made with GITHUB_TOKEN don't fire the push-triggered
        # pages workflow, so kick it explicitly.
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY"
