name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Parse-check every shipped .js file
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.js')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files tracked."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done
